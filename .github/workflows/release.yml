name: release

# Tags in this repo are plain versions like 0.1.1 (no "v" prefix).
on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.21'
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: '.exe' }
          - { goos: windows, goarch: arm64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.21'
          cache: false
      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/snsync-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}${{ matrix.ext }}" \
            ./cmd/snsync
      - name: Package Windows (7z with exe + README)
        if: matrix.goos == 'windows'
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          staging="staging-${{ matrix.goarch }}"
          mkdir -p "$staging"
          cp "dist/snsync-${GITHUB_REF_NAME}-windows-${{ matrix.goarch }}.exe" "$staging/snsync.exe"
          cp README.md "$staging/README.md"
          ( cd "$staging" && 7z a -bso0 -bsp0 "../dist/snsync-${GITHUB_REF_NAME}-windows-${{ matrix.goarch }}.7z" ./* )
          rm -f "dist/snsync-${GITHUB_REF_NAME}-windows-${{ matrix.goarch }}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: snsync-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Add docs to release
        run: cp README.md LICENSE dist/
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
